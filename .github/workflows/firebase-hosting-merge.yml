name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PAYDAY_DAF05 }}
          channelId: live
          projectId: payday-daf05
  deploy_database_rules:
    # NOTE: needs the CI service account (github-action-1174907501@payday-daf05)
    # to hold the "Firebase Realtime Database Admin" role — one-time grant in
    # Cloud Console > IAM. Until then this job fails when rules change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whether rules changed
        id: rules_changed
        run: |
          if git diff --quiet HEAD^ HEAD -- database.rules.json firebase.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.rules_changed.outputs.changed == 'true'
        with:
          node-version: 22
      - name: Deploy Realtime Database rules
        if: steps.rules_changed.outputs.changed == 'true'
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          npx firebase-tools@latest deploy --only database --project payday-daf05 --non-interactive
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PAYDAY_DAF05 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
