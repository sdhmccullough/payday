<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0a2e">
  <meta name="description" content="PayDay — weekly pay calculator with cash tracking and payment history.">
  <title>PayDay</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-512.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== SIGN-IN OVERLAY ===== -->
  <div class="sign-in-overlay" id="sign-in-overlay">
    <div class="sign-in-card">
      <div class="sign-in-logo">💰</div>
      <h1 class="sign-in-title">PayDay</h1>
      <p class="sign-in-subtitle">Weekly pay calculator with real-time sync</p>
      <button class="google-sign-in-btn" id="google-sign-in-btn">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Sign in with Google
      </button>
      <p class="sign-in-note">Sign in to sync data across devices</p>
    </div>
  </div>

  <!-- ===== MAIN APP (hidden until signed in) ===== -->
  <div class="app-container" id="app-container" style="display:none">
    <!-- Header -->
    <header class="app-header">
      <div style="display:flex;align-items:center;gap:8px">
        <h1>PayDay</h1>
        <span class="sync-indicator" id="sync-indicator" title="Sync status">⚪</span>
      </div>
      <div class="header-actions">
        <button id="fill-defaults" class="icon-btn" aria-label="Fill default schedule" title="Fill Mon–Fri 8AM–5PM">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><polyline points="9 16 11 18 15 14"/></svg>
        </button>
        <button id="settings-toggle" class="icon-btn" aria-label="Settings" title="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </header>

    <!-- Settings Panel -->
    <div class="settings-panel" id="settings-panel">
      <div class="settings-card">
        <div class="setting-row">
          <label for="hourly-rate">Hourly Rate</label>
          <div class="input-group">
            <span class="input-prefix">$</span>
            <input type="number" id="hourly-rate" value="22" min="0" step="0.50" inputmode="decimal">
          </div>
        </div>
        <div class="setting-row">
          <label for="fuel-rate">Fuel Per Day</label>
          <div class="input-group">
            <span class="input-prefix">$</span>
            <input type="number" id="fuel-rate" value="10" min="0" step="0.50" inputmode="decimal">
          </div>
        </div>
      </div>
      <div class="settings-card">
        <div class="setting-row">
          <label>Household Code</label>
          <div class="household-code-display">
            <code id="household-code">—</code>
            <button class="icon-btn icon-btn-sm" id="copy-household-code" title="Copy code">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
          </div>
        </div>
        <div class="setting-row">
          <label for="join-household-input">Join Household</label>
          <div class="join-household-group">
            <input type="text" id="join-household-input" placeholder="Paste code" class="join-input">
            <button class="action-btn primary-btn join-btn" id="join-household-btn">Join</button>
          </div>
        </div>
      </div>
      <div class="settings-card">
        <div class="setting-row">
          <label>Signed in as</label>
          <span class="user-email" id="user-email">—</span>
        </div>
        <button class="action-btn reset-btn sign-out-btn" id="sign-out-btn">Sign Out</button>
      </div>
    </div>

    <!-- ===== TAB: TIMESHEET ===== -->
    <div class="tab-content active" id="tab-timesheet">
      <!-- Week Label -->
      <div class="week-label" id="week-label"></div>

      <!-- Timesheet -->
      <div class="timesheet" id="timesheet"></div>

      <!-- Totals -->
      <div class="totals-card" id="totals-card">
        <div class="total-row" id="carryover-row" style="display:none">
          <span class="total-label">Carryover Owed</span>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="total-value carryover-val" id="total-carryover">$0.00</span>
            <button class="clear-day-btn" id="clear-carryover" aria-label="Clear carryover" title="Clear carryover">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
        <div class="total-row">
          <span class="total-label">Total Hours</span>
          <span class="total-value" id="total-hours">0.00</span>
        </div>
        <div class="total-row">
          <span class="total-label">Wages</span>
          <span class="total-value" id="total-wages">$0.00</span>
        </div>
        <div class="total-row">
          <span class="total-label">Fuel</span>
          <span class="total-value" id="total-fuel">$0.00</span>
        </div>
        <div class="total-row">
          <span class="total-label">Bonus</span>
          <div class="input-group input-group-sm">
            <span class="input-prefix">$</span>
            <input type="number" id="bonus-input" value="0" min="0" step="1" inputmode="decimal">
          </div>
        </div>
        <div class="total-row total-grand">
          <span class="total-label">Total Pay</span>
          <span class="total-value" id="total-pay">$0.00</span>
        </div>
      </div>

      <!-- Actions -->
      <div class="timesheet-actions">
        <button class="action-btn primary-btn" id="save-pay-btn">Save &amp; Pay</button>
        <button class="action-btn reset-btn" id="reset-btn">Reset Week</button>
      </div>
    </div>

    <!-- ===== TAB: CASH ===== -->
    <div class="tab-content" id="tab-cash">
      <div class="section-title">Cash on Hand</div>

      <div class="cash-grid" id="cash-grid">
        <!-- Bill rows injected by JS -->
      </div>

      <div class="totals-card">
        <div class="total-row total-grand">
          <span class="total-label">Total Cash</span>
          <span class="total-value" id="cash-total">$0.00</span>
        </div>
      </div>

      <div class="cash-log" id="cash-log">
        <div class="section-title">Transactions</div>
        <div id="cash-transactions"></div>
      </div>
    </div>

    <!-- ===== TAB: HISTORY ===== -->
    <div class="tab-content" id="tab-history">
      <div class="section-title">Payment History</div>
      <div id="history-list"></div>
      <div class="totals-card" id="history-totals" style="display:none">
        <div class="total-row total-grand">
          <span class="total-label">All-time Paid</span>
          <span class="total-value" id="history-grand-total">$0.00</span>
        </div>
      </div>
    </div>

    <!-- Bottom Tab Bar -->
    <nav class="tab-bar" id="tab-bar">
      <button class="tab-btn active" data-tab="timesheet">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span>Timesheet</span>
      </button>
      <button class="tab-btn" data-tab="cash">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        <span>Cash</span>
      </button>
      <button class="tab-btn" data-tab="history">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span>History</span>
      </button>
    </nav>
  </div>

  <!-- Firebase SDK (compat — no build step needed) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="app.js"></script>
</body>
</html>
